<head>

<title>Trivia en directo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#fff;background:radial-gradient(130% 65% at 50% 0,#4b1a7a,#171266 62%,#0e0a45)}
body.transparent{background:transparent}
#app{--u:calc(min(100vw,56.25vh)/100);--A:#ff5a6e;--B:#22c1ff;--C:#ffb52e;--D:#a47bff;--ok:#2fd36b;position:relative;width:min(100vw,56.25vh);height:100vh;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:calc(var(--u)*3.5);padding:calc(var(--u)*5)}

#cofre{justify-self:center;display:flex;align-items:center;gap:calc(var(--u)*2.5);padding:calc(var(--u)*1.4) calc(var(--u)*4);border-radius:99px;background:linear-gradient(90deg,#7a1c12,#b3261e);border:calc(var(--u)*.6) solid #ffe27a;font-size:calc(var(--u)*4.2);transition:box-shadow .3s}
#cofre svg{width:calc(var(--u)*9);height:calc(var(--u)*9)}
#cofre b{color:#ffe27a}
#cofre i{display:none;font-style:normal;padding:0 calc(var(--u)*2);border-radius:99px;background:#ffe27a;color:#3a0a00}
#cofre i.on{display:inline}
body.x #cofre{box-shadow:0 0 calc(var(--u)*5) #ffe27a}
#hud{display:flex;align-items:center;justify-content:space-between}
#round{font-size:calc(var(--u)*5);line-height:1.25;white-space:pre-line;opacity:.9}
#timer{position:relative;width:calc(var(--u)*17);height:calc(var(--u)*17)}
#timer svg{width:100%;height:100%;transform:rotate(-90deg)}
#timer circle{stroke-width:9}
#timer .tr{fill:rgba(8,5,50,.5);stroke:rgba(255,255,255,.2)}
#timer .pg{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0}
#timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--u)*8)}
#timer.low .pg{stroke:var(--A)}
#timer.low b{color:var(--A)}

#q{display:grid;place-items:center;text-align:center;min-height:calc(var(--u)*34);padding:calc(var(--u)*5) calc(var(--u)*4);border-radius:calc(var(--u)*5);background:#fff;color:#1a1464;font-size:calc(var(--u)*6.6);line-height:1.18;box-shadow:0 calc(var(--u)*1.2) 0 rgba(0,0,0,.3)}

#opts{display:grid;grid-template-rows:repeat(4,1fr);gap:calc(var(--u)*2.6)}
.opt{--c:var(--A);position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);padding:0 calc(var(--u)*3);border-radius:calc(var(--u)*4);background:rgba(8,5,50,.55);border:calc(var(--u)*.7) solid var(--c);overflow:hidden;font-size:calc(var(--u)*6);transition:opacity .3s,transform .3s}
.opt:nth-child(2){--c:var(--B)}
.opt:nth-child(3){--c:var(--C)}
.opt:nth-child(4){--c:var(--D)}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);opacity:.38;transition:width .35s ease}
.let,.txt,.pct{position:relative}
.let{flex:none;width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;background:var(--c);color:#171266;display:grid;place-items:center;font-size:calc(var(--u)*6.4)}
.txt{flex:1;line-height:1.1}
.pct{flex:none;min-width:calc(var(--u)*17);text-align:right;font-size:calc(var(--u)*6.4)}
.opt.ok{background:var(--ok);border-color:#fff;color:#06361a;transform:scale(1.03)}
.opt.ok .fill{display:none}
.opt.no{opacity:.35}

#foot{white-space:pre-line;display:grid;place-items:center;min-height:calc(var(--u)*12);text-align:center;font-size:calc(var(--u)*4.6);line-height:1.25}

#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);padding:calc(var(--u)*8);background:rgba(14,10,69,.95);text-align:center}
#end.on{display:flex}
#end h1{font-size:calc(var(--u)*10)}
#rank{width:100%;display:grid;gap:calc(var(--u)*2)}
.row{display:flex;justify-content:space-between;gap:calc(var(--u)*3);padding:calc(var(--u)*3) calc(var(--u)*4);border-radius:calc(var(--u)*3);background:rgba(255,255,255,.12);font-size:calc(var(--u)*5.4)}
.row:first-child{background:var(--C);color:#171266}
.row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#endmsg{font-size:calc(var(--u)*4.6);opacity:.85}

body.x{background:radial-gradient(130% 65% at 50% 0,#8a1c12,#2b0a08 70%)}
body.x #q{background:#ffe27a;color:#3a0a00}
#chest{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);padding:calc(var(--u)*8);text-align:center;background:radial-gradient(circle,#b3261e,#2b0a08)}
#chest.on{display:flex}
#chest small{font-size:calc(var(--u)*6)}
#chest b{font-size:calc(var(--u)*13);line-height:1.05;word-break:break-word;color:#ffe27a}
#chest em{font-style:normal;font-size:calc(var(--u)*8);line-height:1.15}
#dot{display:none;position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;background:#f33}
.debug #dot{display:block}
#dot.on{background:#3f3}
</style>
</head>

  const CAPS = pairs("Noruega:Oslo,Suecia:Estocolmo,Finlandia:Helsinki,Dinamarca:Copenhague,Polonia:Varsovia,Portugal:Lisboa,Grecia:Atenas,Austria:Viena,Suiza:Berna,Irlanda:Dublín,Hungría:Budapest,Rusia:Moscú,Ucrania:Kiev,Cuba:La Habana,Venezuela:Caracas,Ecuador:Quito,Uruguay:Montevideo,Paraguay:Asunción,Panamá:Ciudad de Panamá,Costa Rica:San José,Honduras:Tegucigalpa,Kenia:Nairobi,Nigeria:Abuya,Marruecos:Rabat,Etiopía:Adís Abeba,China:Pekín,Corea del Sur:Seúl,Tailandia:Bangkok,Vietnam:Hanói,Indonesia:Yakarta,India:Nueva Delhi,Pakistán:Islamabad,Irán:Teherán,Irak:Bagdad,Arabia Saudita:Riad,Nueva Zelanda:Wellington,Filipinas:Manila,Bélgica:Bruselas,República Checa:Praga,Rumanía:Bucarest,Croacia:Zagreb,Serbia:Belgrado,Islandia:Reikiavik,Argelia:Argel,Mongolia:Ulán Bator,Nepal:Katmandú,Afganistán:Kabul,Reino Unido:Londres");
  const ELEM = pairs("Hierro:Fe,Plata:Ag,Sodio:Na,Potasio:K,Calcio:Ca,Carbono:C,Hidrógeno:H,Oxígeno:O,Nitrógeno:N,Helio:He,Neón:Ne,Cobre:Cu,Zinc:Zn,Plomo:Pb,Estaño:Sn,Mercurio:Hg,Azufre:S,Fósforo:P,Cloro:Cl,Litio:Li,Magnesio:Mg,Aluminio:Al,Platino:Pt,Uranio:U,Níquel:Ni,Silicio:Si,Yodo:I,Boro:B,Argón:Ar");
  const GEN = [];
  shuf(CAPS).slice(0, 20).forEach(([c, k]) => GEN.push([`¿Cuál es la capital de ${c}?`, k, ...three(CAPS.map(x => x[1]), k)]));
  shuf(ELEM).slice(0, 12).forEach(([e, y]) => GEN.push([`¿Qué elemento químico tiene el símbolo ${y}?`, e, ...three(ELEM.map(x => x[0]), e)]));
  for (let i = 0; i < 36; i++) {
    const a = 12 + rnd(19), b = 3 + rnd(13), pc = [10, 20, 25, 50][rnd(4)];
    const [q, c] = [
      [`¿Cuánto es ${a} × ${b}?`, a * b],
      [`¿Cuánto es ${a * b} ÷ ${b}?`, a],
      [`¿Cuánto es el ${pc}% de ${a * 20}?`, a * 20 * pc / 100],
      [`¿Cuánto es ${b}² + ${a}?`, b * b + a]
    ][i % 4];
    const w = new Set();
    while (w.size < 3) { const d = c + (rnd(7) - 3) * (1 + rnd(3)); if (d !== c && d > 0) w.add(d); }
    GEN.push([q, String(c), ...[...w].map(String)]);
  }

  /* Banco estándar: sin repetidos */
  const seenQ = new Set();
  const QUESTIONS = BASE.concat(FOOT, GEN).filter(a => !seenQ.has(a[0]) && seenQ.add(a[0])).map(a => ({ q: a[0], o: a.slice(1) }));

  /* ----- Banco de Reto Extremo (nivel experto) ----- */
  const XQ = [

    ["¿Quién marcó un hat-trick en la final del Mundial de 1966?","Geoff Hurst","Bobby Charlton","Martin Peters","Roger Hunt"],
    ["¿Quién dirigió a Brasil campeón del mundo en 1970?","Mário Zagallo","Vicente Feola","Telê Santana","Luiz Felipe Scolari"],
    ["¿Quién ganó el Balón de Oro de 1999?","Rivaldo","Luís Figo","Andriy Shevchenko","David Beckham"],
    ["¿Cuántos goles marcó Gerd Müller en total en los Mundiales?","14","12","16","13"],
    ["¿Qué selección ganó la Copa América de 1993, en Ecuador?","Argentina","México","Colombia","Brasil"],
    ["¿Quién fue el primer jugador expulsado en una final de Mundial, en 1990?","Pedro Monzón","Gustavo Dezotti","Marcel Desailly","Zinedine Zidane"],
    ["¿En qué estadio se jugó la final del Mundial de 1978?","Monumental de Núñez","La Bombonera","Gigante de Arroyito","José Amalfitani"],
    ["¿Cuántas selecciones jugaron el primer Mundial, en 1930?","13","16","8","10"],
    ["¿Quién marcó el gol de Portugal en la final de la Eurocopa 2016?","Éder","Nani","Renato Sanches","Ricardo Quaresma"],
    ["¿Qué club ganó la primera Copa Libertadores, en 1960?","Peñarol","Santos","Nacional","Boca Juniors"],
    ["¿Qué selección eliminó a Brasil en penales en los cuartos del Mundial de 1986?","Francia","Argentina","Italia","Alemania Occidental"],
    ["¿Qué emperador romano creó la Tetrarquía?","Diocleciano","Constantino","Augusto","Trajano"],
    ["¿Qué tratado puso fin a la Guerra de los Treinta Años en 1648?","Paz de Westfalia","Paz de Utrecht","Tratado de Viena","Tratado de Versalles"],
    ["¿Qué batalla de 1071 abrió Anatolia a los turcos selyúcidas?","Manzikert","Hattin","Nicópolis","Kosovo"],
    ["¿Quién unificó China en el 221 a. C. como primer emperador?","Qin Shi Huang","Liu Bang","Kublai Kan","Wu Zetian"],
    ["¿En qué año se firmó la Carta Magna inglesa?","1215","1066","1348","1295"],
    ["¿Qué papa coronó emperador a Carlomagno en el año 800?","León III","Esteban II","Gregorio VII","Urbano II"],
    ["¿Qué compañía ganó la batalla de Plassey en 1757, base del dominio británico en la India?","Compañía Británica de las Indias Orientales","Compañía Holandesa de las Indias Orientales","Compañía de la Bahía de Hudson","Compañía Francesa de las Indias"],
    ["¿Qué general romano venció a Aníbal en la batalla de Zama?","Escipión el Africano","Fabio Máximo","Pompeyo","Craso"],
    ["¿Qué conferencia de 1884 y 1885 repartió África entre potencias europeas?","Conferencia de Berlín","Congreso de Viena","Conferencia de Yalta","Conferencia de Versalles"],
    ["¿Qué presidente de Estados Unidos compró Luisiana a Francia en 1803?","Thomas Jefferson","James Madison","John Adams","James Monroe"],
    ["¿Contra qué alianza luchó Paraguay en la guerra de 1864 a 1870?","Brasil, Argentina y Uruguay","Chile, Perú y Bolivia","Brasil, Chile y Bolivia","Argentina, Perú y Colombia"],
    ["¿Qué faraón libró la batalla de Qadesh contra los hititas?","Ramsés II","Tutmosis III","Seti I","Amenhotep III"],
    ["¿Quién fue el padre de Alejandro Magno?","Filipo II de Macedonia","Amintas III","Perdicas II","Antígono"],
    ["¿Quién fue el primer emperador del Imperio mexicano, en 1822?","Agustín de Iturbide","Maximiliano de Habsburgo","Antonio López de Santa Anna","Miguel Hidalgo"],
    ["¿Qué científico descubrió el núcleo atómico con el experimento de la lámina de oro?","Ernest Rutherford","J. J. Thomson","Niels Bohr","James Chadwick"],
    ["¿Qué elemento, además del mercurio, es líquido a 25 °C?","Bromo","Galio","Cesio","Yodo"],
    ["¿Qué tipo de enzima corta el ADN en secuencias específicas?","Endonucleasa de restricción","ADN polimerasa","Helicasa","Ligasa"],
    ["¿Cuánto vale el cero absoluto en grados Celsius?","−273,15 °C","−100 °C","−459,67 °C","−373,15 °C"],
    ["¿Qué número cuántico determina la forma de un orbital?","Azimutal","Principal","Magnético","De espín"],
    ["¿Cómo se llama el punto de la órbita terrestre más lejano al Sol?","Afelio","Perihelio","Apogeo","Perigeo"],
    ["¿Quién descubrió el neutrón en 1932?","James Chadwick","Ernest Rutherford","Enrico Fermi","Niels Bohr"],
    ["¿Qué ley dice que la presión de un gas es inversamente proporcional a su volumen a temperatura constante?","Ley de Boyle","Ley de Charles","Ley de Gay-Lussac","Ley de Avogadro"],
    ["¿Qué astrónomo danés midió las posiciones planetarias que usó Kepler?","Tycho Brahe","Copérnico","Galileo","Edmund Halley"],
    ["¿Qué gas noble tiene número atómico 54?","Xenón","Criptón","Radón","Argón"],
    ["¿Qué base nitrogenada del ARN reemplaza a la timina?","Uracilo","Citosina","Adenina","Guanina"],
    ["¿Cuántos dígitos tiene un googol?","101","100","99","1000"],
    ["¿Quién demostró el último teorema de Fermat?","Andrew Wiles","Grigori Perelman","Terence Tao","Carl Friedrich Gauss"],
    ["¿Qué matemático suizo introdujo la notación f(x) y popularizó el número e?","Leonhard Euler","Carl Friedrich Gauss","Daniel Bernoulli","Joseph-Louis Lagrange"],
    ["¿Quién dirigió Ciudadano Kane?","Orson Welles","Alfred Hitchcock","Stanley Kubrick","John Huston"],
    ["¿Qué película de 1927 es considerada la primera de cine sonoro comercial?","El cantor de jazz","Metrópolis","Luces de la ciudad","Nosferatu"],
    ["¿Quién compuso la ópera Tosca?","Giacomo Puccini","Giuseppe Verdi","Gioachino Rossini","Georges Bizet"],
    ["¿Quién escribió Pedro Páramo?","Juan Rulfo","Juan Carlos Onetti","Carlos Fuentes","Octavio Paz"],
    ["¿Qué pintor neerlandés creó La joven de la perla?","Johannes Vermeer","Rembrandt","Frans Hals","Jan van Eyck"],
    ["¿Qué poeta ganó el Nobel de Literatura en 1945?","Gabriela Mistral","Pablo Neruda","Vicente Huidobro","Nicanor Parra"],
    ["¿Qué arquitecto diseñó el Museo Guggenheim de Bilbao?","Frank Gehry","Norman Foster","Zaha Hadid","Santiago Calatrava"],
    ["¿Qué actor ganó el Óscar por Pozos de ambición?","Daniel Day-Lewis","Joaquin Phoenix","Javier Bardem","George Clooney"],
    ["¿Quién dirigió Los siete samuráis?","Akira Kurosawa","Yasujiro Ozu","Kenji Mizoguchi","Hayao Miyazaki"],
    ["¿Quién escribió El maestro y Margarita?","Mijaíl Bulgákov","Vladimir Nabokov","Borís Pasternak","Aleksandr Solzhenitsyn"],
    ["¿En qué año se publicó el álbum Thriller de Michael Jackson?","1982","1984","1979","1980"],
    ["¿En qué año salió la primera PlayStation en Japón?","1994","1995","1992","1996"],
    ["¿Cuál es el lago más profundo del mundo?","Baikal","Tanganica","Superior","Titicaca"],
    ["¿Qué país tiene costas en el mar Caspio y en el golfo Pérsico?","Irán","Irak","Turkmenistán","Azerbaiyán"],
    ["¿Qué estrecho separa Sicilia de la Italia continental?","Estrecho de Mesina","Estrecho de Gibraltar","Estrecho de Bonifacio","Estrecho de Otranto"],
    ["¿Cuál es la capital de Burkina Faso?","Uagadugú","Bamako","Niamey","Accra"],
    ["¿Qué país tiene más husos horarios contando sus territorios de ultramar?","Francia","Rusia","Estados Unidos","Reino Unido"],
    ["¿Cuál es el río más largo de Asia?","Yangtsé","Río Amarillo","Mekong","Ganges"],
    ["¿Qué desierto se considera el más seco del mundo fuera de los polos?","Atacama","Sahara","Gobi","Namib"],
    ["¿Qué país tiene más islas del mundo?","Suecia","Noruega","Finlandia","Canadá"]
  ].map(a => ({ q: a[0], o: a.slice(1) }));

  /* ============ ESTADO ============ */
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const S = { queue: [], xdeck: [], extreme: false, time: 20, phase: "idle", order: [], qi: 0, opts: [], votes: new Map(), counts: [0, 0, 0, 0], deadline: 0, scores: new Map() };
  let wait;

  $("cofremon").textContent = `${CFG.roses} rosas 🌹`;
  if (P.has("transparent")) document.body.classList.add("transparent");
  if (P.has("debug")) document.body.classList.add("debug");

  /* ============ VOZ (Web Speech API) ============ */
  let spk = 0;
  /* Prefiere voces neuronales (Edge: Natural/Online), luego las de Google, luego el resto */
  function pickVoice() {
    const L = ["es-mx", "es-us", "es-419", "es-es"];
    const norm = v => v.lang.replace("_", "-").toLowerCase();
    const name = (P.get("voz") || "").toLowerCase(), lang = (P.get("lang") || "").toLowerCase();
    const score = v => {
      const n = v.name.toLowerCase(), l = norm(v), k = L.indexOf(l);
      return (name && n.includes(name) ? 1000 : 0) + (lang && l === lang ? 500 : 0)
        + (/natural/.test(n) ? 100 : /online|neural/.test(n) ? 60 : /google/.test(n) ? 30 : 0)
        + (k >= 0 ? 10 - k : 0);
    };
    return speechSynthesis.getVoices().filter(v => norm(v).startsWith("es")).sort((a, b) => score(b) - score(a))[0];
  }
  /* Narra el texto y llama a cb al terminar. Si no hay voz o no suena, llama a cb enseguida. */
  function speak(text, cb) {
    const id = ++spk;
    let done = false, t1, t2;
    const end = () => { if (done || id !== spk) return; done = true; clearTimeout(t1); clearTimeout(t2); cb && cb(); };
    if (!CFG.voice || !("speechSynthesis" in window)) return end();
    speechSynthesis.cancel();
    const v = pickVoice();
    if (!v) return end();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = CFG.rate;
    u.onstart = () => clearTimeout(t1);
    u.onend = u.onerror = end;
    t1 = setTimeout(end, 2500);                                   /* no arrancó: sigue sin voz */
    t2 = setTimeout(end, text.length * 90 / CFG.rate + 4000);     /* tope por si nunca termina */
    setTimeout(() => speechSynthesis.speak(u), 50);
  }

  /* ============ FLUJO DEL JUEGO ============ */
  function start() {
    clearTimeout(wait);
    $("end").classList.remove("on");
    S.order = shuffle(QUESTIONS.map((_, i) => i)).slice(0, CFG.rounds * CFG.perRound);
    S.qi = 0;
    S.perRound = CFG.perRound;
    S.scores = new Map();
    showQuestion();
  }

  function showQuestion(x) {
    if (!x && !S.extreme && S.queue.length) return chest();   /* regalo en cola: abrir cofre */
    S.time = x ? CFG.xtime : CFG.time;
    const item = x || QUESTIONS[S.order[S.qi]];
    S.opts = shuffle(item.o.map((t, i) => ({ t, ok: i === 0 })));
    S.votes = new Map();
    S.counts = [0, 0, 0, 0];
    $("q").textContent = item.q;
    $("round").textContent = x ? "COFRE DE RETO EXTREMO" : `Ronda ${Math.floor(S.qi / S.perRound) + 1} de ${Math.ceil(S.order.length / S.perRound)}\nPregunta ${S.qi % S.perRound + 1} de ${Math.min(S.perRound, S.order.length - S.qi + S.qi % S.perRound)}`;
    const box = $("opts");
    box.textContent = "";
    S.opts.forEach((o, i) => {
      const d = document.createElement("div");
      d.className = "opt";
      d.innerHTML = '<div class="fill"></div><div class="let"></div><div class="txt"></div><div class="pct">0%</div>';
      d.children[1].textContent = "ABCD"[i];
      d.children[2].textContent = o.t;
      box.appendChild(d);
    });
    $("foot").textContent = x ? "Reto extremo: vale 300 puntos" : "Escribe A, B, C o D en el chat";
    $("timer").classList.remove("low");
    S.phase = "reading";
    $("sec").textContent = S.time;
    document.querySelector(".pg").style.strokeDashoffset = 0;
    speak(`${x ? "Pregunta extrema" : "Pregunta " + (S.qi + 1)}. ${item.q} ${S.opts.map((o, i) => `${"ABCD"[i]}: ${o.t}.`).join(" ")}`, () => {
      S.deadline = Date.now() + S.time * 1000;
      S.phase = "question";
    });
  }

  function reveal() {
    S.phase = "reveal";
    const ok = S.opts.findIndex(o => o.ok);
    [...$("opts").children].forEach((d, i) => d.classList.add(i === ok ? "ok" : "no"));
    const winners = [...S.votes.values()].filter(v => v.i === ok);
    winners.forEach(v => {
      const s = S.scores.get(v.id) || { name: v.name, pts: 0 };
      s.pts += (S.extreme ? 300 : 100) + Math.round((S.extreme ? 150 : 50) * v.left / S.time); /* 100 + bono por rapidez */
      S.scores.set(v.id, s);
    });
    $("foot").textContent = winners.length
      ? `✔ ${winners.length} ${winners.length > 1 ? "acertaron" : "acertó"}: ${winners.slice(0, 3).map(w => w.name).join(", ")}${winners.length > 3 ? " y más" : ""}`
      : "Nadie acertó esta vez";
    let n = 0;
    const go = () => { if (++n === 2) S.extreme ? endExtreme() : next(); };
    wait = setTimeout(go, CFG.reveal * 1000);
    speak(`La respuesta correcta es ${"ABCD"[ok]}: ${S.opts[ok].t}.`, go);
  }

  function next() {
    S.qi++;
    if (S.qi >= S.order.length) finish(true);
    else if (S.qi % S.perRound === 0) finish(false);
    else showQuestion();
  }

  /* ============ COFRE DE RETO EXTREMO (regalos) ============ */
  function badge() {   /* contador de cofres en espera junto al icono */
    const i = $("cofrecount");
    i.textContent = `+${S.queue.length}`;
    i.classList.toggle("on", S.queue.length > 0);
  }

  function gift(name) {
    S.queue.push(name);
    badge();
    if (!S.extreme && (S.phase === "reading" || S.phase === "question")) chest();  /* pausa la trivia normal */
  }

  function chest() {
    const name = S.queue.shift();
    badge();
    S.phase = "chest";
    clearTimeout(wait);
    $("chestname").textContent = name;
    $("chest").classList.add("on");
    let n = 0;
    const go = () => {
      if (++n < 2) return;
      $("chest").classList.remove("on");
      if (!S.xdeck.length) S.xdeck = shuffle(XQ);
      S.extreme = true;
      document.body.classList.add("x");
      showQuestion(S.xdeck.pop());
    };
    wait = setTimeout(go, CFG.chest * 1000);
    speak(`${name} abrió el Cofre de Reto Extremo`, go);
  }

  function endExtreme() {   /* vuelve a la trivia normal, repitiendo la pregunta que se pausó */
    S.extreme = false;
    document.body.classList.remove("x");
    showQuestion();
  }

  function finish(final) {
    S.phase = "end";
    const top = [...S.scores.values()].sort((a, b) => b.pts - a.pts).slice(0, 5);
    const r = $("rank");
    r.textContent = "";
    if (!top.length) top.push({ name: "Nadie participó todavía", pts: null });
    top.forEach((s, i) => {
      const d = document.createElement("div"), a = document.createElement("span"), b = document.createElement("span");
      d.className = "row";
      a.textContent = s.pts === null ? s.name : `${i + 1}. ${s.name}`;
      b.textContent = s.pts === null ? "" : `${s.pts} pts`;
      d.append(a, b);
      r.appendChild(d);
    });
    $("endtitle").textContent = final ? "¡Fin del juego!" : `Ronda ${S.qi / S.perRound} completada`;
    $("end").classList.add("on");
    if (S.scores.size) speak(final ? `¡Fin del juego! El campeón es ${top[0].name}.` : `Ronda ${S.qi / S.perRound} completada. Va primero ${top[0].name}.`);
    let n = CFG.end;
    const tick = () => {
      $("endmsg").textContent = `${final ? "Nueva partida" : "Siguiente ronda"} en ${n} s`;
      if (n-- > 0) { wait = setTimeout(tick, 1000); return; }
      if (final) start(); else { $("end").classList.remove("on"); showQuestion(); }
    };
    tick();
  }

  /* Temporizador */
  setInterval(() => {
    if (S.phase !== "question") return;
    const left = Math.max(0, (S.deadline - Date.now()) / 1000);
    $("sec").textContent = Math.ceil(left);
    document.querySelector(".pg").style.strokeDashoffset = 100 * (1 - left / S.time);
    $("timer").classList.toggle("low", left <= 5);
    if (left <= 0) reveal();
  }, 100);

  /* ============ VOTOS ============ */
  function bars() {
    const tot = S.counts.reduce((a, b) => a + b, 0);
    [...$("opts").children].forEach((d, i) => {
      const p = tot ? Math.round(S.counts[i] / tot * 100) : 0;
      d.children[0].style.width = p + "%";
      d.children[3].textContent = p + "%";
    });
  }

  /* Solo cuenta el primer voto válido de cada usuario por pregunta */
  function vote(id, name, text) {
    if (S.phase !== "question" && S.phase !== "reading") return;
    const m = String(text).trim().match(/^([a-d1-4])[\s.)!:]*$/i);
    if (!m || S.votes.has(id)) return;
    const c = m[1].toLowerCase(), i = /\d/.test(c) ? c - 1 : c.charCodeAt(0) - 97;
    S.votes.set(id, { id, name, i, left: S.phase === "reading" ? S.time : Math.max(0, (S.deadline - Date.now()) / 1000) });
    S.counts[i]++;
    bars();
  }

  /* ============ CONEXIÓN CON TIKFINITY ============ */
  let retry = 1000;
  function onMsg(m) {
    if (!m || typeof m !== "object") return;
    const ev = String(m.event || m.type || "").toLowerCase();
    if (ev === "gift") {
      const g = m.data || m;
      if (g.giftType === 1 && g.repeatEnd !== undefined && !g.repeatEnd) return;   /* racha en curso: contar solo al terminar */
      const nombre = String(g.giftName ?? g.name ?? "").trim().toLowerCase();
      if (!CFG.gifts.includes(nombre) && !(!P.get("gift") && +g.giftId === 5655)) return;   /* solo cuentan las rosas */
      const roses = +g.repeatCount || 1;
      const n = Math.min(CFG.maxChests, Math.floor(roses / CFG.roses));   /* 1 pregunta por cada 10 rosas */
      for (let i = 0; i < n; i++) gift(String(g.nickname || g.uniqueId || "Alguien"));
      return;
    }
    if (ev !== "chat" && ev !== "comment") return;
    const d = m.data || m;
    const id = String(d.uniqueId || d.userId || d.nickname || "");
    if (id) vote(id, d.nickname || d.uniqueId || id, d.comment ?? d.text ?? "");
  }

  function connect() {
    let ws;
    try { ws = new WebSocket(CFG.ws); } catch (e) { return setTimeout(connect, 5000); }
    ws.onopen = () => { retry = 1000; $("dot").classList.add("on"); };
    ws.onclose = () => {
      $("dot").classList.remove("on");
      setTimeout(connect, retry);
      retry = Math.min(retry * 1.5, 10000);
    };
    ws.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (P.has("debug")) console.log("TikFinity:", m);
      [].concat(m).forEach(onMsg);
    };
  }

  /* Audiencia simulada para pruebas */
  if (P.has("test")) {
    setInterval(() => {
      const u = "usuario" + ((Math.random() * 40 | 0) + 1);
      vote(u, u, "ABCD"[Math.random() * 4 | 0]);
    }, 250);
  }

  if (P.has("test")) addEventListener("keydown", e => { if (e.key.toLowerCase() === "x") gift("Usuario de prueba"); });

  connect();
  if ("speechSynthesis" in window) { speechSynthesis.getVoices(); if (P.has("debug")) console.log("Preguntas: estándar", QUESTIONS.length, "extremas", XQ.length), speechSynthesis.onvoiceschanged = () => console.log("Voces:", speechSynthesis.getVoices().map(v => v.name + " (" + v.lang + ")")); setTimeout(start, 1000); } else start();
})();
</script>
